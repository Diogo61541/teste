<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tela de Login</title>
    <style>
      :root {
        --bg-1: #f1f5f9;
        --bg-2: #dbeafe;
        --card: #ffffff;
        --primary: #0f766e;
        --primary-hover: #115e59;
        --text: #0f172a;
        --muted: #475569;
        --border: #cbd5e1;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: radial-gradient(circle at top left, var(--bg-2), var(--bg-1));
        color: var(--text);
      }

      .login-window {
        width: min(900px, 92vw);
        min-height: 520px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        background: var(--card);
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 0 24px 48px rgba(15, 23, 42, 0.18);
      }

      .left-panel {
        padding: 48px;
        background: linear-gradient(135deg, #0f766e, #14b8a6);
        color: #ffffff;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 16px;
      }

      .left-panel h1 {
        margin: 0;
        font-size: 2rem;
        line-height: 1.2;
      }

      .left-panel p {
        margin: 0;
        line-height: 1.6;
        opacity: 0.95;
      }

      .right-panel {
        padding: 48px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .right-panel h2 {
        margin: 0 0 24px;
        font-size: 1.6rem;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 16px;
      }

      .field label {
        font-size: 0.92rem;
        color: var(--muted);
      }

      .field input {
        height: 44px;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 0 12px;
        font-size: 1rem;
      }

      .field input:focus {
        outline: 2px solid rgba(15, 118, 110, 0.25);
        border-color: var(--primary);
      }

      .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 6px 0 18px;
        font-size: 0.9rem;
        color: var(--muted);
      }

      .row a {
        color: var(--primary);
        text-decoration: none;
      }

      .row a:hover {
        text-decoration: underline;
      }

      .btn {
        width: 100%;
        height: 46px;
        border: 0;
        border-radius: 10px;
        background: var(--primary);
        color: #ffffff;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s ease;
      }

      .btn:hover {
        background: var(--primary-hover);
      }

      .signup {
        margin-top: 18px;
        font-size: 0.92rem;
        text-align: center;
        color: var(--muted);
      }

      .signup a {
        color: var(--primary);
        text-decoration: none;
        font-weight: 600;
      }

      @media (max-width: 860px) {
        .login-window {
          grid-template-columns: 1fr;
          min-height: 0;
        }

        .left-panel,
        .right-panel {
          padding: 28px;
        }
      }
    </style>
  </head>
  <body>
    <main class="login-window">
      <section class="left-panel">
        <h1>Bem-vindo de volta</h1>
        <p>
          Acesse sua conta para continuar. Esta janela foi dividida em duas partes,
          como uma tela de login tradicional.
        </p>
      </section>

      <section class="right-panel">
        <h2>Entrar</h2>
        <form>
          <div class="field">
            <label for="email">E-mail</label>
            <input type="email" id="email" placeholder="seuemail@exemplo.com" required />
          </div>

          <div class="field">
            <label for="senha">Senha</label>
            <input type="password" id="senha" placeholder="Digite sua senha" required />
          </div>

          <div class="row">
            <label><input type="checkbox" /> Lembrar-me</label>
            <a href="#">Esqueci a senha</a>
          </div>

          <button class="btn" type="submit">Entrar</button>
        </form>

        <p class="signup">Nao tem conta? <a href="#">Criar agora</a></p>
      </section>
    </main>
  </body>
</html>
